name: Deploy Socials to Namecheap

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: socials-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build Next.js with Webpack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx next build --webpack

      - name: Verify production build
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/BUILD_ID
          test -d .next/server
          test -d .next/static/css
          find .next/static/css -name '*.css' -size +10k | grep -q .
          echo "Built commit $GITHUB_SHA"

      - name: Package production build
        run: |
          tar -czf socials-build.tar.gz \
            --exclude='.next/cache' \
            --exclude='.next/dev' \
            .next

      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check Namecheap prerequisites
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'test -f ~/socials-app/server.js &&
             test -f ~/socials-app/.env.local &&
             test -f ~/socials-app/.next/BUILD_ID &&
             test -L ~/socials-app/node_modules &&
             echo "Namecheap prerequisites OK"'

      - name: Upload production archive
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -P "$SSH_PORT" socials-build.tar.gz \
            "$SSH_USER@$SSH_HOST:~/socials-build.tar.gz"

      - name: Activate new build
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -e
          cd ~/socials-app
          mkdir -p ~/socials-release-stage
          test ! -e ~/socials-release-stage/.next
          tar -xzf ~/socials-build.tar.gz -C ~/socials-release-stage
          test -f ~/socials-release-stage/.next/BUILD_ID
          test -d ~/socials-release-stage/.next/static/css
          chmod -R u+X ~/socials-release-stage/.next

          if [ -d .next-github-backup ]; then
            mv .next-github-backup ".next-previous-$(date +%Y%m%d%H%M%S)"
          fi
          mv .next .next-github-backup
          mv ~/socials-release-stage/.next .next
          mkdir -p tmp
          touch tmp/restart.txt
          echo "New build activated"
          REMOTE

      - name: Health check
        id: health
        continue-on-error: true
        run: |
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 15 \
              https://socials.primeflix4all.site/api/health -o /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Roll back on failed health check
        if: steps.health.outcome == 'failure'
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -e
          cd ~/socials-app
          test -d .next-github-backup
          mv .next ".next-failed-$(date +%Y%m%d%H%M%S)"
          mv .next-github-backup .next
          mkdir -p tmp
          touch tmp/restart.txt
          echo "Previous build restored"
          REMOTE
          echo "Health check failed; rollback requested"
          exit 1

      - name: Clean up successful deployment
        if: steps.health.outcome == 'success'
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'rm -f ~/socials-build.tar.gz &&
             rmdir ~/socials-release-stage 2>/dev/null || true'
