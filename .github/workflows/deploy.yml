
name: Build Socials for Namecheap

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build Next.js with Webpack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx next build --webpack

      - name: Verify production build
        shell: bash
        run: |
          test -f .next/BUILD_ID
          test -d .next/server
          test -d .next/static/css
          find .next/static/css -name '*.css' -size +10k | grep -q .
          echo "Production build and Tailwind CSS verified"

      - name: Package production build
        run: |
          tar -czf socials-build.tar.gz \
            --exclude='.next/cache' \
            --exclude='.next/dev' \
            .next

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: socials-production-build
          path: socials-build.tar.gz
          retention-days: 7
